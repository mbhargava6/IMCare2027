# ---------------------------------------------------------------------------
# The IMCare team. Bios are carried over word-for-word from the previous site.
#
# To hide someone from the site, add:      hidden: true
# To show someone again, delete that line (or set it to false).
# To add someone new, copy an existing block, change the details, and put a
# 640x640 photo in images/team/ named to match the `photo:` value.
#
# `group` must be one of the group ids listed in _data/team_groups.yml.
# ---------------------------------------------------------------------------

- name: "Mukesh Bhargava, M.D."
  role: "Internal Medicine Specialist"
  group: physicians
  photo: "mukesh-bhargava.jpg"
  bio: "Dr. Bhargava has been practicing since 1996, and co-founded IMCare in 2012. His clinical interests include heart disease, vascular neurology, and diabetes. He is passionate about integrative medicine and wellness."

- name: "Anuja Sharma, M.D."
  role: "Internal Medicine Specialist"
  group: physicians
  photo: "anuja-sharma.jpg"
  bio: "Dr. Sharma has been practicing Medicine since 1996, and co-founded IMCare in 2012. Her interests include diagnosing and treating the diseases of the skin, thyroid disorders, osteoporosis, and inflammatory arthritis. She enjoys cooking, hiking, and travel when not at work."

- name: "Behtash Saeidi, M.D., M.P.H."
  role: "Internal Medicine Specialist"
  group: physicians
  photo: "behtash-saeidi.jpg"
  bio: "Dr. Saeidi joined our team of specialists at Heart Care and IMCare in April 2021. He completed his residency training in Internal Medicine at Maimonides Medical Center in Brooklyn, New York, and his fellowship in Hospital Medicine at the University Health Network (UHN) / University of Toronto. He is board certified in Internal Medicine by the American Board of Internal Medicine and the College of Physicians and Surgeons of Ontario."

- name: "Rishi Bhargava, M.D."
  role: "Cardiologist"
  group: physicians
  photo: "rishi-bhargava.jpg"
  bio: "Dr. Rishi Bhargava joined IMCare in 2019. He is a Cardiologist and Internal Medicine Specialist. He has offices in Oshawa and Cobourg."

- name: "Michel Boivin, M.D."
  role: "Critical Care Specialist"
  group: physicians
  photo: "michel-boivin.jpg"
  bio: "Dr. Michel Boivin received his medical degree from McGill University and completed internal medicine residency there. He completed a critical care fellowship at the University of New Mexico. While there Dr. Boivin underwent training in echocardiography including trans-esophageal echocardiography, and first completed the National Board of Echocardiography examination in 2013 and again in 2023. Dr. Boivin is a well known expert in teaching advanced echocardiography and trans-esophageal echocardiography in critical care and has presented and taught at numerous international conferences. He has numerous published articles and book chapters related to ultrasound. Currently Dr. Boivin works as an intensive care doctor and internal medicine specialist at NHH."

