- name: "Darius Seidler, M.D., F.R.C.P.C."
  role: "Respirologist"
  group: physicians
  photo: "darius-seidler.jpg"
  hidden: true
  bio: "Dr. Seidler is a specialist who holds board certification from the Royal College of Physicians and Surgeons of Canada and American Board of Internal Medicine (ABIM) in Internal Medicine and is ABIM board certified and CPSO recognized in Respirology and Critical Care. He completed his residency in Internal Medicine at Norwalk Hospital, Yale University School of Medicine and his fellowship in Respirology and Critical Care at Dartmouth-Hitchcock Medical Center, USA. He has been in practice since 2017 and joined IMCare in 2022. Dr. Seidler's areas of interest include: asthma, chronic cough, COPD, interstitial lung disease and shortness of breath."

