# ---------------------------------------------------------------------------
# Patient Tools — organised by what a patient came looking for.
#
# Structure:  topic  ->  groups (Read / Watch / Print)  ->  links
#   name    what the patient sees. Plain language first, medical term after
#           it in brackets where the medical word is worth knowing.
#   link    starts with "/"  = a PDF on this site
#           starts with http = another organisation's website, opens in a
#                              new tab
#
# The PDF / Video / Web label on each link is worked out automatically.
# Reordering topics here reorders both the topic chooser and the page.
# ---------------------------------------------------------------------------

