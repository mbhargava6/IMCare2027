# ---------------------------------------------------------------------------
# Jekyll configuration. GitHub Pages reads this file when it builds the site.
# Day-to-day content edits do NOT belong here — see _data/site.yml instead.
# ---------------------------------------------------------------------------

title: "IMCare"
description: "IMCare is an Internal Medicine specialist practice in Port Hope, Ontario. Cardiac and skin care, in-person and virtually, with our own echocardiography lab."
url: "https://www.imcare.ca"
lang: en-CA

# baseurl — READ THIS BEFORE CHANGING IT.
# GitHub serves this repo at mbhargava6.github.io/IMCare2027/, i.e. inside a
# subfolder, so every link and image needs that prefix to resolve. The line
# below adds it.
# WHEN YOU MOVE THE SITE TO imcare.ca, DELETE THE LINE BELOW (or set it to "").
# imcare.ca serves from the root, and leaving the prefix in place would break
# every link and image on the live site.
baseurl: "/IMCare2027"

permalink: pretty
timezone: America/Toronto

sass:
  style: compressed

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - EDITING.md
  - CONTENT-REVIEW.md
  - vendor
  - node_modules
