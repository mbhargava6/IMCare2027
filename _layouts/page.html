---
layout: default
---
<div class="page-head">
  <div class="wrap">
    <p class="breadcrumb"><a href="{{ '/' | relative_url }}">Home</a> <span aria-hidden="true">/</span> {{ page.title }}</p>
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</div>

<div class="section">
  <div class="wrap">
    <div class="content {% unless page.wide %}prose{% endunless %}">
      {{ content }}
    </div>
  </div>
</div>

{% unless page.hide_cta %}{% include cta.html %}{% endunless %}
