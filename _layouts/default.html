<!DOCTYPE html>
{%- assign S = site.data.site -%}
<html lang="{{ site.lang }}" data-palette="{{ S.palette }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }} — {{ S.tagline }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 300 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/images/favicon-32.png' | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IMCare">
  <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }} — {{ S.tagline }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 300 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/clinic-hero.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="{{ '/assets/fonts/playfair-display.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalClinic",
    "name": "IMCare",
    "url": "{{ site.url }}",
    "telephone": "{{ S.phone }}",
    "faxNumber": "{{ S.fax }}",
    "medicalSpecialty": ["InternalMedicine", "Cardiovascular", "Dermatology"],
    "openingHoursSpecification": [{
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "{{ S.hours.opens }}",
      "closes": "{{ S.hours.closes }}"
    }],
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ S.address.line1 }}",
      "addressLocality": "{{ S.address.city }}",
      "addressRegion": "{{ S.address.province }}",
      "postalCode": "{{ S.address.postal_code }}",
      "addressCountry": "CA"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
